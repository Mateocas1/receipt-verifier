[project]
name = "receipt-verifier"
version = "0.1.0"
description = "Argentine bank-transfer receipt verifier: extraction, deterministic validation and evaluation harness."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "receipt-verifier contributors" }]
keywords = ["receipts", "ocr", "argentina", "evaluation", "banking"]

dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pillow>=11.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Local OCR: tesserocr wheels bundle Tesseract 5 itself, so no system package is needed
# (language data still has to be present; see OCR_TESSDATA / dataset docs).
ocr = ["tesserocr>=2.8"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_verifier"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "ANN",  # flake8-annotations
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"scripts/**" = ["T20"]
# Report aggregation mirrors the untyped JSON the harness writes, so its helpers
# legitimately accept dynamically typed values.
"src/receipt_verifier/eval_summary.py" = ["ANN401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["PIL.*", "tesserocr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ocr: requires the 'ocr' extra plus Tesseract language data (see OCR_TESSDATA)",
]
